name: Release

# 推送形如 v0.0.1 的标签时自动打包并发布
on:
  push:
    tags:
      - 'v*'

# 同一标签重复触发时，取消上一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 打包并发布
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 还原签名文件
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${{ runner.temp }}/lumo-release.jks"

      - name: 打包
        env:
          MIHON_GITHUB_RELEASE: true
          storeFile: ${{ runner.temp }}/lumo-release.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pdist=github

      - name: 收集安装包
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
